[package]
name = "mddag"
version = "1.3.0"
edition = "2021"
license = "Apache-2.0"
description = "Lodestone Protocol (MD-DAG) v1.3 Final reference parser"
repository = "https://github.com/lodestone-protocol/lodestone-md"

[lib]
name = "mddag"
path = "src/lib.rs"

[[bin]]
name = "mddag"
path = "src/main.rs"

[dependencies]
comrak = "0.54.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
