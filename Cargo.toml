[package]
name = "mddag"
version = "1.3.0"
edition = "2021"
license = "MIT"
description = "Lodestone Protocol (MD-DAG) v1.3 reference parser: embed DAG metadata in CommonMark Markdown for knowledge convergence"
repository = "https://github.com/lodestone-protocol/lodestone-md"
readme = "README.md"
keywords = ["markdown", "dag", "commonmark", "knowledge-graph", "ai-agent"]
categories = ["parser-implementations"]
documentation = "https://docs.rs/mddag"
exclude = [
    "/docs",
    "/tests",
    "/.github",
    "/README.zh-CN.md",
]

[lib]
name = "mddag"
path = "src/lib.rs"

[[bin]]
name = "mddag"
path = "src/main.rs"

[dependencies]
comrak = "0.54.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
