[package]
name = "mddag"
version = "2.0.0"
edition = "2021"
license = "MIT"
description = "Implements Lodestone Protocol v2.0-draft (MD-DAG 2) — markdown-native DAG: heading=skeleton, links=magnetic lines, body=iron filings, status=list. L0/L1/L2 on-demand read + streaming append ops."
repository = "https://github.com/lodestone-protocol/lodestone-md"
readme = "README.md"
keywords = ["markdown", "dag", "commonmark", "knowledge-graph", "ai-agent"]
categories = ["parser-implementations"]

[lib]
name = "mddag"
path = "src/lib.rs"

[[bin]]
name = "mddag"
path = "src/main.rs"

[dependencies]
# Zero dependencies: v2 parsing is a line-level scanner over CommonMark
# structure (headings + lists + links) — no AST, no JSON, no serde.
